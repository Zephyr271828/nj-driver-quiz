<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NJ 驾照笔试题库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="plate">NJ</span><h1>驾照笔试题库</h1>
      <div class="sync" id="sync"><span class="dot" id="sdot"></span><span id="stxt">本机保存</span></div>
    </div>
    <div class="statline" id="statline"></div>
    <div class="bar" id="bar"></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="seq">顺序练习</button>
      <button class="tab bk" role="tab" data-v="book">错题本<span class="n" id="nbook">0</span></button>
      <button class="tab" role="tab" data-v="exam">模拟考试</button>
      <button class="tab" role="tab" data-v="map">进度总览</button>
    </nav>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
